version: "2"
type: frontend
tech_stack:
  - TypeScript
  - Next.js 16 (App Router)
  - React 19
  - Zustand (state management)
  - Axios
  - Socket.io-client
  - Tailwind CSS
  - Mapbox GL JS

routes:
  - path: /
    file: src/app/page.tsx
    auth_required: true
    description: Root redirect to login or dashboard
  - path: /dashboard
    file: src/app/dashboard/page.tsx
    auth_required: true
    description: Operations overview dashboard with active orders, drivers, revenue stats
  - path: /admin/orders
    file: src/app/admin/orders/page.tsx
    auth_required: true
    description: Admin orders management page
  - path: /admin/map
    file: src/app/admin/map/page.tsx
    auth_required: true
    description: Live fleet map with real-time driver locations
  - path: /admin/support
    file: src/app/admin/support/page.tsx
    auth_required: true
    description: Support tickets management
  - path: /drivers
    file: src/app/drivers/page.tsx
    auth_required: true
    description: Driver fleet management page
  - path: /merchants
    file: src/app/merchants/page.tsx
    auth_required: true
    description: Merchant/restaurant management page
  - path: /analytics
    file: src/app/analytics/page.tsx
    auth_required: true
    description: Platform analytics and metrics
  - path: /finance
    file: src/app/finance/page.tsx
    auth_required: true
    description: Finance and payout management
  - path: /alerts
    file: src/app/alerts/page.tsx
    auth_required: true
    description: Platform alerts and notifications
  - path: /ai-monitor
    file: src/app/ai-monitor/page.tsx
    auth_required: true
    description: AI monitoring panel (WAP metrics)
  - path: /zones
    file: src/app/zones/page.tsx
    auth_required: true
    description: Delivery zone management
  - path: /settings
    file: src/app/settings/page.tsx
    auth_required: true
    description: Admin settings and configuration

features:
  - name: Admin Login
    description: Admin authenticates using email and password via the login form on the root page. Successful login sets JWT token in localStorage and redirects to dashboard.
    files:
      - src/app/page.tsx
      - src/services/auth.ts
      - src/services/api.ts
    entry_route: /
    user_interactions:
      - Enter email in the email input field (id="email")
      - Enter password in the password input field (id="password")
      - Click the Login / Sign In button to submit
      - See error message on invalid credentials
      - On success, dashboard loads with Operations Overview
    api_calls:
      - method: POST
        endpoint: /api/v1/auth/login
    auth_required: false

  - name: Operations Dashboard
    description: Shows real-time operations overview with active orders, on-delivery count, available drivers, revenue, and cancelled rate. Includes live orders table and activity feed.
    files:
      - src/app/dashboard/page.tsx
      - src/stores/dashboardStore.ts
    entry_route: /dashboard
    user_interactions:
      - View Active Orders count
      - View On-Delivery count
      - View Available Drivers count
      - View Revenue Today
      - View Cancelled Rate
      - See Live Orders table rows
      - Click View all in Live Orders
    api_calls:
      - method: GET
        endpoint: /api/v1/admin/orders
      - method: GET
        endpoint: /api/v1/admin/drivers
      - method: GET
        endpoint: /api/v1/admin/support/tickets
      - method: GET
        endpoint: /api/v1/admin/refunds
      - method: GET
        endpoint: /api/v1/admin/fraud/flags
      - method: GET
        endpoint: /api/v1/admin/ai/metrics
      - method: GET
        endpoint: /api/v1/admin/merchants
    auth_required: true

  - name: Driver Fleet Management
    description: Admin can view all drivers with their status, rating, and earnings. Can toggle driver active/inactive status and view reviews.
    files:
      - src/app/drivers/page.tsx
      - src/stores/dashboardStore.ts
    entry_route: /drivers
    user_interactions:
      - View driver list with status badges
      - Filter drivers by status (All, Online, Offline)
      - Search drivers by name
      - Click View Reviews button for a driver
      - Toggle driver active/inactive status
    api_calls:
      - method: GET
        endpoint: /api/v1/admin/drivers
      - method: GET
        endpoint: /api/v1/ratings/driver/{id}
    auth_required: true

  - name: Merchant Management
    description: Admin can view all restaurants/merchants with their status, commission, and ratings.
    files:
      - src/app/merchants/page.tsx
      - src/stores/dashboardStore.ts
    entry_route: /merchants
    user_interactions:
      - View merchant list with status badges
      - Search merchants by name
      - Click View Reviews button for a merchant
      - Click Suspend/Activate merchant
    api_calls:
      - method: GET
        endpoint: /api/v1/admin/merchants
      - method: GET
        endpoint: /api/v1/ratings/restaurant/{id}
    auth_required: true

  - name: Orders Management
    description: Admin can view all platform orders with status, amount, customer, driver, and restaurant info.
    files:
      - src/app/admin/orders/page.tsx
      - src/stores/dashboardStore.ts
    entry_route: /admin/orders
    user_interactions:
      - View order list table
      - Filter by order status
      - Search by order ID or customer name
    api_calls:
      - method: GET
        endpoint: /api/v1/admin/orders
    auth_required: true

  - name: Support Tickets
    description: Admin can view and manage support tickets submitted by customers.
    files:
      - src/app/admin/support/page.tsx
    entry_route: /admin/support
    user_interactions:
      - View support tickets list
      - Filter by status (open, resolved)
      - Click on a ticket to view details
    api_calls:
      - method: GET
        endpoint: /api/v1/admin/support/tickets
    auth_required: true

known_limitations:
  - issue: Socket.io WebSocket connection may fail if backend is cold-starting on Render free tier
    location: src/services/realtime.ts
    impact: Live updates via WebSocket will reconnect automatically but may have initial delay
  - issue: Dashboard data relies on NEXT_PUBLIC_API_URL which must end with /api/v1
    location: src/services/api.ts
    impact: Incorrect URL causes CORS errors and 404 responses - fixed by formatApiUrl helper
