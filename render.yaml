services:
  # 1. Wolfie Flask & WebSocket Web API Service
  - type: web
    name: wolfie-backend-api
    runtime: python
    rootDir: wolfie_backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "gunicorn --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker --workers 1 --bind 0.0.0.0:$PORT --timeout 120 --keep-alive 5 wsgi:app"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wolfie-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: wolfie-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: AI_ENCRYPTION_KEY
        generateValue: true
      - key: MAPBOX_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false

  # 2. Celery Worker (Background tasks & notifications)
  - type: worker
    name: wolfie-celery-worker
    runtime: python
    rootDir: wolfie_backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "celery -A celery_app.celery worker --loglevel=info -Q default,notifications,matching,payouts,wap"
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wolfie-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: wolfie-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: wolfie-backend-api
          envVarKey: SECRET_KEY
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: wolfie-backend-api
          envVarKey: JWT_SECRET_KEY
      - key: AI_ENCRYPTION_KEY
        fromService:
          type: web
          name: wolfie-backend-api
          envVarKey: AI_ENCRYPTION_KEY
      - key: MAPBOX_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # 3. Celery Beat Scheduler (Periodic cron tasks)
  - type: worker
    name: wolfie-celery-beat
    runtime: python
    rootDir: wolfie_backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "celery -A celery_app.celery beat --loglevel=info"
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wolfie-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: wolfie-redis
          property: connectionString

  # 4. Redis Cache & Broker
  - type: redis
    name: wolfie-redis
    ipAllowList: []
    plan: starter
    maxmemoryPolicy: allkeys-lru

databases:
  # 5. Managed PostgreSQL Database
  - name: wolfie-postgres
    databaseName: wolfie
    user: wolfie_user
    plan: starter
