<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFE600" />
    <title>Wolfie — Offline</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        background: linear-gradient(135deg, #fff9e6 0%, #ffe600 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        padding: 20px;
      }

      .container {
        text-align: center;
        background: white;
        border-radius: 20px;
        padding: 40px 30px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        max-width: 400px;
      }

      .icon {
        font-size: 80px;
        margin-bottom: 20px;
        display: inline-block;
      }

      h1 {
        font-size: 28px;
        color: #3c2f2f;
        margin-bottom: 10px;
        font-weight: 700;
      }

      p {
        font-size: 16px;
        color: #666;
        line-height: 1.6;
        margin-bottom: 30px;
      }

      .status {
        font-size: 14px;
        color: #a6a6a6;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 600;
        margin-bottom: 20px;
      }

      button {
        background: #ffe600;
        color: #3c2f2f;
        border: none;
        padding: 14px 30px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 12px rgba(255, 230, 0, 0.3);
      }

      button:hover {
        background: #ffd700;
        box-shadow: 0 6px 20px rgba(255, 230, 0, 0.4);
        transform: translateY(-2px);
      }

      button:active {
        transform: translateY(0);
      }

      .tips {
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #f0f0f0;
        text-align: left;
      }

      .tips h3 {
        font-size: 14px;
        color: #3c2f2f;
        margin-bottom: 10px;
        font-weight: 600;
      }

      .tips ul {
        list-style: none;
        font-size: 13px;
        color: #666;
        line-height: 1.8;
      }

      .tips li:before {
        content: '✓ ';
        color: #ffe600;
        font-weight: bold;
        margin-right: 8px;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #f0f0f0;
        border-top-color: #ffe600;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 20px auto;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .status-waiting {
        display: none;
      }

      .status-waiting.active {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">📡</div>
      <h1>No Connection</h1>
      <p class="status">You're offline</p>
      <p>
        It looks like you've lost your internet connection. Some features may be
        limited, but cached content is still available.
      </p>

      <div class="status-waiting active">
        <div class="spinner"></div>
        <p style="font-size: 14px; color: #a6a6a6; margin-top: 10px;">
          Waiting for connection...
        </p>
      </div>

      <button onclick="window.location.reload()">Retry Now</button>

      <div class="tips">
        <h3>What you can do offline:</h3>
        <ul>
          <li>View your order history</li>
          <li>Check your saved restaurants</li>
          <li>Review cached menu items</li>
        </ul>
      </div>
    </div>

    <script>
      // Auto-reconnect when network is back
      window.addEventListener('online', () => {
        console.log('Back online!');
        document.querySelector('.status-waiting').classList.add('active');
        // Wait a bit before reloading to ensure API is ready
        setTimeout(() => {
          window.location.reload();
        }, 1000);
      });

      window.addEventListener('offline', () => {
        console.log('Going offline');
      });

      // Check for connection every 3 seconds
      setInterval(() => {
        if (navigator.onLine) {
          // Still wait a moment to ensure backend is reachable
          setTimeout(() => {
            window.location.reload();
          }, 500);
        }
      }, 3000);
    </script>
  </body>
</html>
